---
- name: Include OS-specific variables
  ansible.builtin.set_fact:
    migrate_arch: "{{ migrate_arch_map[ansible_architecture] | default('amd64') }}"
    migrate_version_number: "{{ migrate_version | regex_replace('^v', '') }}"
    migrate_package_type: "{{ migrate_package_type_map[ansible_os_family] | default('deb') }}"

- name: Derive package download metadata
  ansible.builtin.set_fact:
    migrate_effective_url: >-
      {% if migrate_package_url %}
      {{ migrate_package_url }}
      {% else %}
      {{ migrate_release_base_url }}/{{ migrate_version }}/migrate_{{ migrate_version_number }}_linux_{{ migrate_arch }}.{{ migrate_package_type }}
      {% endif %}

- name: Determine remote temporary directory
  ansible.builtin.set_fact:
    migrate_package_tempdir: "{{ ansible_env.TMPDIR | default(ansible_env.TEMP, true) | default(ansible_env.TMP, true) | default('/tmp', true) }}"

- name: Derive package filename
  ansible.builtin.set_fact:
    migrate_effective_filename: "{{ migrate_effective_url | basename | trim }}"

- name: Derive package download path
  ansible.builtin.set_fact:
    migrate_download_path: "{{ migrate_package_tempdir.rstrip('/') }}/{{ migrate_effective_filename }}"

- name: Derive service directory paths
  ansible.builtin.set_fact:
    migrate_effective_config_dir: "{{ __migrate_config_dir }}"
    migrate_effective_config_parent: "{{ __migrate_config_dir | dirname }}"
    migrate_effective_config_path: "{{ __migrate_config_dir }}/{{ migrate_config_filename }}"
  vars:
    __raw_migrate_config_dir: "{{ migrate_config_dir | default(migrate_service_home ~ '/.config/migrate', true) }}"
    __migrate_config_dir: "{{ __raw_migrate_config_dir | trim | regex_replace('/+$', '') }}"

- name: Ensure temporal runtime group exists
  ansible.builtin.group:
    name: "{{ temporal_runtime_group }}"
    system: true

- name: Ensure temporal runtime user exists
  ansible.builtin.user:
    name: "{{ temporal_runtime_user }}"
    group: "{{ temporal_runtime_group }}"
    system: true
    create_home: false
    home: "{{ migrate_data_dir }}"
    shell: "/usr/sbin/nologin"

- name: Ensure migrate data directory exists
  ansible.builtin.file:
    path: "{{ migrate_data_dir }}"
    state: directory
    owner: "{{ temporal_runtime_user }}"
    group: "{{ temporal_runtime_group }}"
    mode: "0750"

- name: Ensure migrate config parent directory exists
  ansible.builtin.file:
    path: "{{ migrate_effective_config_parent }}"
    state: directory
    owner: "{{ migrate_service_user }}"
    group: "{{ migrate_service_group }}"

- name: Ensure migrate config directory exists
  ansible.builtin.file:
    path: "{{ migrate_effective_config_dir }}"
    state: directory
    owner: "{{ migrate_service_user }}"
    group: "{{ migrate_service_group }}"
    mode: "0750"

- name: Install SELinux tooling when required
  ansible.builtin.package:
    name: "{{ __migrate_selinux_packages }}"
    state: present
  vars:
    __migrate_selinux_packages: "{{ (migrate_selinux_required_packages[ansible_os_family] | default([])) | list }}"
  when:
    - ansible_selinux.status | default('disabled') == 'enabled'
    - __migrate_selinux_packages | length > 0

- name: Apply SELinux port labels for Temporal and migrate services
  community.general.seport:
    ports: "{{ item.port | int }}"
    proto: "{{ item.proto | default('tcp') }}"
    setype: "{{ item.type | default('http_port_t') }}"
    state: present
  loop: "{{ migrate_selinux_port_labels }}"
  loop_control:
    label: "{{ item.port }}/{{ item.proto | default('tcp') }}"
  when:
    - migrate_selinux_port_labels | length > 0
    - ansible_selinux.status | default('disabled') == 'enabled'

- name: Assemble migrate configuration
  ansible.builtin.set_fact:
    migrate_effective_config: "{{ migrate_config | combine({
      'temporal': {
        'address': '127.0.0.1:' ~ (migrate_temporal_grpc_port | string),
      },
      'storage_service': {
        'api': {
          'url': migrate_storage_service_api_url,
          'username': migrate_storage_service_api_username,
          'api_key': migrate_storage_service_api_key,
        },
        'management': {
          'mode': 'host',
          'host': {
            'python_path': migrate_storage_service_host_python_path,
            'manage_path': migrate_storage_service_host_manage_path,
            'environment': migrate_storage_service_host_environment,
          },
        },
        'locations': {
          'source_location_id': migrate_storage_service_source_location_id,
          'move_target_location_id': migrate_storage_service_move_target_location_id,
          'replication_targets': migrate_storage_service_replication_targets,
        },
      },
    }, recursive=True) }}"

- name: Download migrate package
  ansible.builtin.get_url:
    url: "{{ migrate_effective_url }}"
    dest: "{{ migrate_download_path }}"
    mode: "0644"
    checksum: "{{ (migrate_package_checksum | length > 0) | ternary(migrate_package_checksum, omit) }}"
  register: migrate_package_download

- name: Install migrate package on Debian
  ansible.builtin.apt:
    deb: "{{ migrate_download_path }}"
    state: present
  when: ansible_os_family == "Debian"

- name: Install migrate package on RedHat
  ansible.builtin.dnf:
    name: "{{ migrate_download_path }}"
    state: present
    disable_gpg_check: "{{ migrate_disable_gpg_check | default(false) }}"
  when: ansible_os_family == "RedHat"

- name: Deploy migrate configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ migrate_effective_config_path }}"
    owner: "{{ migrate_service_user }}"
    group: "{{ migrate_service_group }}"
    mode: "0640"
  notify: restart migrate

- name: Install temporal systemd service unit
  ansible.builtin.template:
    src: temporal.service.j2
    dest: /etc/systemd/system/temporal.service
    owner: root
    group: root
    mode: "0644"
  notify: restart temporal

- name: Install migrate worker systemd service unit
  ansible.builtin.template:
    src: migrate.service.j2
    dest: /etc/systemd/system/migrate.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - restart migrate

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Ensure services are enabled and started
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - temporal.service
    - migrate.service
